{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Exam</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<div class="container">

    <h2>
        {{ exam.title }}
    </h2>

    <form method="POST">

        {% csrf_token %}

        {% for q in questions %}

        <div class="question-box">

            <h3>
                Q{{ forloop.counter }}.
                {{ q.question }}
            </h3>

            <div class="option">
                <input type="radio" name="{{ q.id }}" value="{{ q.option1 }}">
                {{ q.option1 }}
            </div>

            <div class="option">
                <input type="radio" name="{{ q.id }}" value="{{ q.option2 }}">
                {{ q.option2 }}
            </div>

            <div class="option">
                <input type="radio" name="{{ q.id }}" value="{{ q.option3 }}">
                {{ q.option3 }}
            </div>

            <div class="option">
                <input type="radio" name="{{ q.id }}" value="{{ q.option4 }}">
                {{ q.option4 }}
            </div>

        </div>

        {% endfor %}

        <button type="submit">
            Submit Exam
        </button>

    </form>

</div>

</body>
</html>
